[project]
name = "taskanline"
version = "0.1.0"
description = "TasKanLine — трекер задач для команд, работающих вместе с ИИ-агентами"
requires-python = ">=3.13,<3.14"
dependencies = [
    "taskanline-backend",
    "taskanline-sdk",
    "taskanline-cli",
    "taskanline-mcp",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "sdk", "cli", "mcp"]

[tool.uv.sources]
taskanline-backend = { workspace = true }
taskanline-sdk = { workspace = true }
taskanline-cli = { workspace = true }
taskanline-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "ruff>=0.14",
    "mypy>=1.14",
]

# --- Инструменты ------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
# docs/ — markdown с примерами кода: ruff форматирует такие блоки, а в плане
# они специально написаны компактно, чтобы читались глазами.
extend-exclude = ["backend/migrations/versions", "docs"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",
]
ignore = [
    # Комментарии и докстроки в проекте на русском: правила про «похожие на латиницу»
    # символы срабатывают на каждой кириллической строке и ничего не ловят.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# Пакеты воркспейса установлены в окружение, и без этой строки ruff считает их
# сторонними и перемешивает с fastapi.
known-first-party = ["app", "tests", "sdk_tests", "cli_tests", "taskanline_sdk", "taskanline_cli", "taskanline_mcp"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/app", "sdk/src"]
exclude = ["backend/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Фикстуры живут в том же цикле событий, что и тест: соединение asyncpg,
# открытое в чужом цикле, падает с "attached to a different loop".
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "sdk/sdk_tests"]
addopts = "-q --strict-markers"
