# Продуктовый хост: статика веб-клиента и прокси на API.
# Админский хост появится на этапе 6 отдельным server-блоком.
server {
    listen 80;
    server_name _;

    root /srv/frontend_client;
    index index.html;

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрут разбирает клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
