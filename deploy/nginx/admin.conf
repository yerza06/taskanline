# Админский хост: статика frontend_admin и прокси на тот же API.
#
# Закрыт по IP на уровне nginx — продуктовый хост это не затрагивает (админ-спека §2).
# Подставьте свои сети: офис, VPN. Без allow-строк админка доступна отовсюду —
# защищена только ролью и паролем, а этого для панели управления сервером мало.
server {
    listen 80;
    server_name _;

    # allow 10.0.0.0/8;        # VPN
    # allow 203.0.113.17;      # офис
    # deny all;

    root /srv/frontend_admin;
    index index.html;

    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
