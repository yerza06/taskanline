# Полный стек: PostgreSQL, API и веб-клиент за nginx.
# Запуск из корня репозитория: docker compose -f deploy/docker-compose.yml up -d
name: taskanline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskanline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskanline}
      POSTGRES_DB: ${POSTGRES_DB:-taskanline}
    volumes:
      - taskanline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskanline}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DB__USER: ${POSTGRES_USER:-taskanline}
      DB__PASSWORD: ${POSTGRES_PASSWORD:-taskanline}
      DB__NAME: ${POSTGRES_DB:-taskanline}
      # Хост — имя сервиса в сети compose, порт всегда внутренний 5432:
      # POSTGRES_PORT публикует базу на хост и к этой связи отношения не имеет.
      DB__HOST: postgres
      DB__PORT: 5432
      SECURITY__SECRET_KEY: ${SECURITY__SECRET_KEY:?SECURITY__SECRET_KEY обязателен — см. .env.example в корне}
      APP__PUBLIC_URL: ${APP__PUBLIC_URL:-http://localhost:8080}
      APP__ENVIRONMENT: ${APP__ENVIRONMENT:-production}
      LOG__LEVEL: ${LOG__LEVEL:-INFO}
      CORS__ORIGINS: ${CORS__ORIGINS:-http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend_client:
    build:
      context: ..
      dockerfile: frontend_client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  taskanline-postgres:
