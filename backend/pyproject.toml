[project]
name = "taskanline-backend"
description = "API TasKanLine на FastAPI"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "uuid6>=2024.7",
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]
