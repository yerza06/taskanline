name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9"

jobs:
  python-lint:
    name: Линтеры Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend

  backend-tests:
    name: Тесты бэкенда
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskanline
          POSTGRES_PASSWORD: taskanline
          POSTGRES_DB: taskanline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskanline"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Тестовую базу создаёт и мигрирует фикстура migrated_database.
      TEST_DATABASE_URL: postgresql+asyncpg://taskanline:taskanline@localhost:5432/taskanline_test
      SECURITY__SECRET_KEY: ci-secret-key-at-least-32-characters-long
      APP__ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  frontend_client:
    name: Веб-клиент
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  docker-build:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: frontend_client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend_client/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
